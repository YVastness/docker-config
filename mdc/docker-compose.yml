version: "3"

services:
  
  mdc:
    image: mdcng/mdc:latest
    container_name: mdc
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /docker/mdc/config:/config # 配置目录，必须
      - /mnt/sda2/Videos/Girls:/media # 媒体库，可映射多个
    network_mode: host
    #ports:
    #  - 9208:9208
    restart: unless-stopped  
